name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + origin/main, needed for the ancestry check
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Check tag against Cargo.toml and main
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            docker_arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            docker_arch: arm64
          - target: aarch64-apple-darwin
            os: macos-15
            docker_arch: ''
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # Both runners are native for their target, so musl-gcc is the right C compiler
          # for build scripts of C-using crates such as ring.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          set -euo pipefail
          name="subscribe-${VERSION}-${TARGET}"
          mkdir -p "stage/$name" dist
          cp "target/${TARGET}/release/subscribe" README.md LICENSE config.example.toml "stage/$name/"
          tar -C stage -czf "dist/${name}.tar.gz" "$name"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/subscribe-*.tar.gz
            dist/subscribe-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Stage raw binary for Docker
        if: matrix.docker_arch != ''
        run: |
          set -euo pipefail
          mkdir -p "docker-bin/${{ matrix.docker_arch }}"
          cp "target/${TARGET}/release/subscribe" "docker-bin/${{ matrix.docker_arch }}/subscribe"
      - name: Upload raw binary
        if: matrix.docker_arch != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.docker_arch }}
          path: docker-bin/${{ matrix.docker_arch }}/subscribe
          if-no-files-found: error
          retention-days: 7

  crates:
    name: Publish to crates.io
    needs: [ci, verify, build, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/subscribe/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing (OIDC)
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      # Re-runs are safe: crates.io versions are immutable, so skip if present.
      - name: Check whether this version is already published
        id: exists
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "subscribe-release (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/subscribe/${VERSION}")
          echo "crates.io status for ${VERSION}: ${code}"
          echo "published=$([[ "$code" == 200 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Preferred: short-lived token via Trusted Publishing. Fails until a trusted
      # publisher is configured for the crate on crates.io; the long-lived
      # CARGO_REGISTRY_TOKEN secret is the fallback (required for the first publish).
      - name: Authenticate (Trusted Publishing)
        id: auth
        if: steps.exists.outputs.published == 'false'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.exists.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          AUTH_MODE: ${{ steps.auth.outputs.token && 'trusted publishing' || 'CARGO_REGISTRY_TOKEN secret' }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "::error::No crates.io credentials: configure Trusted Publishing or the CARGO_REGISTRY_TOKEN secret"
            exit 1
          fi
          echo "Publishing subscribe ${VERSION} using ${AUTH_MODE}"
          cargo publish --locked

  # Publishing the GitHub release is the last step, so a release never exists
  # without its container image and crate.
  release:
    name: GitHub release
    needs: [ci, verify, build, docker, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: release
      - name: Checksums and release notes
        run: |
          set -euo pipefail
          (cd release && sha256sum -- *.tar.gz > SHA256SUMS)
          awk -v v="$VERSION" '
            found && /^\[[^]]+\]: / { exit }
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" v "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION] - YYYY-MM-DD' section"
            exit 1
          fi
          cat release-notes.md
          ls -l release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/SHA256SUMS

  docker:
    name: Docker image
    needs: [ci, verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist-download
      - name: Lay out dist/<arch>/subscribe
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            mkdir -p "dist/$arch"
            cp "dist-download/bin-$arch/subscribe" "dist/$arch/subscribe"
            chmod 0755 "dist/$arch/subscribe"
          done
          ls -lR dist
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # The prebuilt stage only COPYs a native binary, but the shared runtime stage has RUN steps
      # (apk, adduser) that execute under emulation for the non-native platform.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
