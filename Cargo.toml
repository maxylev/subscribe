[package]
name = "subscribe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Stateless on-chain subscription service: users pay ERC-20 tokens to rent jobs (HTTP calls or shell commands) that run on your server and report to Telegram."
license = "MIT"
repository = "https://github.com/maxylev/subscribe"
readme = "README.md"
keywords = ["subscription", "ethereum", "telegram", "erc20", "bip32"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "config.example.toml"]

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
k256 = { version = "0.14.0", features = ["arithmetic"], default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
ripemd = "0.2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "process", "signal", "sync", "io-util"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
